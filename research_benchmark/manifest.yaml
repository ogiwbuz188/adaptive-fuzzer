- id: BOLA_id_enumeration
  category: Broken_object_level_Auth
  entrypoint: research_benchmark/Broken_object_level_Auth/BOLA_id_enumeration.py
  route: /api/v1/user-lookup
  method: GET
  port: 9000
  runs: 40
  startup_timeout_seconds: 10
  timeout_seconds: 90
  authorization_scenarios:
  - scenario_id: owner-object-readable-by-other-user
    route: /api/v1/user-lookup
    owner_identity: owner
    other_user_identity: other
    owned_object_id: '42'
    object_parameter: id
    object_id_field: id
    owner_headers:
      Authorization: Bearer owner-token
    other_user_headers:
      Authorization: Bearer other-token
    expected_vulnerable: true
